services:
  student-platform-staging:
    image: ${IMAGE_NAME}:${STAGING_IMAGE_TAG}
    container_name: sit753-student-platform-staging
    ports:
      - "8081:3000"
    environment:
      - NODE_ENV=staging
      - PORT=3000
      - API_KEY=${STAGING_API_KEY}
    volumes:
      - staging_data:/app/data
      - staging_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  student-platform-prod:
    image: ${IMAGE_NAME}:${PROD_IMAGE_TAG}
    container_name: sit753-student-platform-prod
    ports:
      - "8082:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_KEY=${PROD_API_KEY}
    volumes:
      - prod_data:/app/data
      - prod_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sit753-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    depends_on:
      - student-platform-staging
      - student-platform-prod
    restart: unless-stopped
volumes:
  staging_data:
  staging_logs:
  prod_data:
  prod_logs: