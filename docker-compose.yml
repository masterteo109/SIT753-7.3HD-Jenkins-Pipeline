services:
  student-platform:
    build: .
    image: sit753-student-platform:latest
    container_name: sit753-student-platform
    ports:
      - "8081:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_KEY=change-this-api-key
      - DATA_FILE=/app/data/students-db.json
      - LOG_LEVEL=info
    volumes:
      - student_data:/app/data
      - student_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: sit753-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - student-platform
    restart: unless-stopped

volumes:
  student_data:
  student_logs:
